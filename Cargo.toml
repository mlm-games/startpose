[package]
name = "startpage"
version = "0.2.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
repose-core = "0.17.5"
repose-ui = "0.17.5"
repose-platform = { version = "0.17.5", features = ["web"] }
repose-render-wgpu = "0.17.5"
repose-material = "0.17.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
web-time = "1"
urlencoding = "2"

# wasm glue
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
console_log = "1.0"

# browser APIs
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Location",
    "Storage",
] }

getrandom = { version = "0.3.4", features = ["wasm_js"] }

wgpu = { version = "29", features = ["webgpu", "webgl"] }
winit = { version = "0.30", features = ["rwh_05"] }

